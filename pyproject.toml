[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "luw2007-bloomfilter"
version = "0.3.0"
description = "Redis-backed Bloom filter compatible with pyreBloom's storage format"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "luw2007", email = "luw2007@gmail.com" }]
dependencies = ["redis>=5,<9"]

[project.optional-dependencies]
test = ["build>=1.3,<2", "fakeredis>=2.31,<3", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
